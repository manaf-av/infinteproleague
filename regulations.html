<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="img/logo/iplfavicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Global League Regulations | Infinite Pro League</title>
  <style>
    :root { color-scheme: dark; --rail: #1a1a1a; --gold: #c6a160; --rail-width: 112px; }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: #000; color: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .side-nav { position: fixed; z-index: 5; inset: 0 auto 0 0; display: flex; width: var(--rail-width); flex-direction: column; align-items: center; padding: 24px 12px 20px; background: var(--rail); }
    .brand { display: grid; width: 76px; height: 64px; place-items: center; margin-bottom: 34px; }
    .brand img { display: block; width: 72px; max-height: 58px; object-fit: contain; }
    .nav-links { display: flex; width: 100%; flex: 1; flex-direction: column; align-items: center; gap: 9px; }
    .nav-link { display: flex; width: 84px; min-height: 76px; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 8px; background: transparent; color: #bdbdbd; font-size: 10px; font-weight: 600; letter-spacing: .045em; text-decoration: none; transition: background .18s ease, color .18s ease; }
    .nav-link img { width: 25px; height: 25px; object-fit: contain; opacity: .82; }
    .nav-link:hover, .nav-link[aria-current="page"] { background: #292929; color: #fff; }
    .nav-link:hover img, .nav-link[aria-current="page"] img { opacity: 1; }
    .nav-link.register { min-height: 72px; margin-top: auto; background: #d52b2b; color: #fff; }
    .nav-link.register:hover { background: #f03a3a; }
    .nav-link.register img { width: 21px; height: 25px; }
    .more-menu { position: relative; width: 100%; }
    .more-menu > summary { list-style: none; cursor: pointer; }
    .more-menu > summary::-webkit-details-marker { display: none; }
    .more-card { position: absolute; z-index: 10; bottom: 0; left: calc(100% + 12px); display: none; width: 270px; gap: 6px; padding: 10px; border: 1px solid #343434; border-radius: 10px; background: #181818; box-shadow: 0 14px 36px #0009; }
    .more-menu:hover .more-card, .more-menu:focus-within .more-card, .more-menu[open] .more-card { display: grid; }
    .more-option { display: flex; min-height: 54px; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 7px; color: #eee; font-size: 13px; font-weight: 650; line-height: 1.3; text-decoration: none; }
    .more-option:hover, .more-option:focus-visible { background: #292929; color: #fff; }
    .more-option img { flex: 0 0 auto; width: 25px; height: 25px; object-fit: contain; }
    .more-option .icn-logo { width: 72px; height: 30px; filter: brightness(0) invert(1); }
    .more-option.mobile-register { background: #D52B2B; }
    .more-option.mobile-register:hover, .more-option.mobile-register:focus-visible { background: #f03a3a; }
    main { min-height: 100vh; margin-left: var(--rail-width); padding: 28px 32px 40px; }
    .document-page { display: flex; width: min(1400px, 100%); height: calc(100vh - 68px); min-height: 400px; flex-direction: column; margin: 0 auto; }
    .document-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: -.03em; }
    .download-link { color: var(--gold); font-size: 13px; font-weight: 650; text-decoration: none; white-space: nowrap; }
    .download-link:hover { color: #fff; }
    .pdf-viewer { width: 100%; flex: 1; min-height: 0; border: 1px solid #333; border-radius: 6px; background: #181818; }
    @media (max-width: 700px) {
      :root { --rail-width: 0px; }
      .side-nav { inset: auto 0 0; width: 100%; height: calc(68px + env(safe-area-inset-bottom)); flex-direction: row; justify-content: center; padding: 5px 7px calc(5px + env(safe-area-inset-bottom)); border-top: 1px solid #303030; }
      .brand, .side-nav > .nav-link.register { display: none; }
      .nav-links { flex: initial; width: min(100%, 520px); height: 100%; flex-direction: row; justify-content: space-around; gap: 0; }
      .nav-link { width: 20%; min-height: 54px; gap: 5px; border-radius: 6px; font-size: 9px; letter-spacing: 0; }
      .nav-link img { width: 20px; height: 20px; }

      .more-menu { position: static; flex: 1; min-width: 0; width: auto; }
      .more-menu > summary { width: 100%; min-height: 54px; gap: 5px; font-size: 9px; letter-spacing: 0; }
      .more-card { position: fixed; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); left: 12px; width: auto; }
      main { margin-left: 0; padding: 20px 14px calc(86px + env(safe-area-inset-bottom)); }
      .document-page { height: calc(100vh - 122px - env(safe-area-inset-bottom)); min-height: 300px; }
      .document-heading { align-items: flex-start; flex-direction: column; gap: 7px; }
    }
      @media (max-width: 900px) {
      :root { --rail-width: 0px; }
      .side-nav { inset: auto 0 0; width: 100%; height: calc(68px + env(safe-area-inset-bottom)); flex-direction: row; justify-content: center; padding: 5px 7px calc(5px + env(safe-area-inset-bottom)); border-top: 1px solid #303030; }
      .brand, .side-nav > .nav-link.register { display: none; }
      .nav-links { flex: initial; width: min(100%, 520px); height: 100%; flex-direction: row; align-items: center; justify-content: space-around; gap: 0; }
      .nav-links > a[href*="news.html"] { display: none; }
      .nav-link { width: 25%; min-height: 54px; gap: 5px; border-radius: 6px; font-size: 9px; letter-spacing: 0; }
      .nav-link img { width: 20px; height: 20px; }
      .more-menu { position: static; flex: 1; min-width: 0; width: auto; }
      .more-menu > summary { width: 100%; min-height: 54px; gap: 5px; font-size: 9px; letter-spacing: 0; }
      .more-card { position: fixed; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); left: 12px; width: auto; }
      main { margin-left: 0; }
    }
  </style>
</head>
<body>

        <h1 id="document-title">Global League Regulations</h1>
        <a class="download-link" href="doc/Global%20League%20Regulations%20-%20INFINITE%20PRO%20LEAGUE.pdf" target="_blank" rel="noopener">Open PDF in a new tab</a>
