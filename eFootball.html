<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>eFootball Registration | Infinite Pro League</title>
    <link rel="icon" href="img/iplfavicon.png">
    <style>
        :root {
            --bg: #07080b;
            --panel: #101319;
            --text: #ffffff;
            --muted: #cfcfcf;
            --accent: #ff5a1f;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .form_page {
            width: 100%;
            height: 100vh;
            background: var(--bg);
        }

        .form_frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        @media (max-width: 767px) {
            .form_page {
                height: 100dvh;
            }
        }
    </style>
</head>

<body>
    <div class="form_page">
        <iframe class="form_frame"
            src="https://docs.google.com/forms/d/e/1FAIpQLSdzd59m8kadbyD6pIchrkU2lR0mMc14uF_RYRnK7STsoDQOGA/viewform?embedded=true"
            title="eFootball Registration Form"
            loading="lazy"
            allowfullscreen>
            Loading…
        </iframe>
    </div>
</body>

</html>
